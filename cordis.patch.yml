# Mount the usage-stats server plugin when this package is registered as a
# DeepSeek Harness profile bundle.
#
# 可选配置（在本文件 insert 条目或 profile 的 cordis.patch.yml 中覆盖）：
#   config.prices —— 计价覆盖表（元 / 百万 tokens），优先级高于内置官方表：
#     config:
#       prices:
#         "<model-id>": { peak: { hit, miss, output }, offpeak: { hit, miss, output } }  # 峰谷两档
#         "<model-id>": { hit, miss, output }                                            # 全天一口价
#         default: { hit, miss, output }
#     内置官方表（未覆盖时生效）见 lib/pricing.js：DeepSeek V4 Pro/Flash 峰谷价 +
#     2026-08-17 前的旧版统一价。
- insert:
    - id: usage-stats
      name: dsh-usage-stats-plus
